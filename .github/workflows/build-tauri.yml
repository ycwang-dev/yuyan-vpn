name: Build Tauri App

on:
  push:
    branches:
      - feat/github-actions-build
      - main
      - yuyan-vpn
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

env:
  RELEASE_REPOSITORY: ycwang-dev/yuyan-vpn-releases

jobs:
  prep-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Missing repository secret: TAURI_SIGNING_PRIVATE_KEY' >&2
            exit 1
          fi
          if [ -z "$PUBLIC_RELEASE_TOKEN" ]; then
            echo 'Missing repository secret: PUBLIC_RELEASE_TOKEN' >&2
            exit 1
          fi

      - name: Calculate Version
        id: calc
        run: node scripts/bump-version.js
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          RELEASE_REPOSITORY: ${{ env.RELEASE_REPOSITORY }}

      - name: Test updater manifest generator
        run: node --test scripts/generate-update-manifest.test.js

  windows-engine-feasibility:
    needs: prep-version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'
          cache: false

      - name: Build pinned zju-connect candidate with Wintun
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $SourceDir = Join-Path $env:RUNNER_TEMP 'zju-connect-source'
          $OutputDir = Join-Path $env:GITHUB_WORKSPACE 'windows-engine-candidate'
          git clone --filter=blob:none --no-checkout https://github.com/Mythologyli/zju-connect.git $SourceDir
          git -C $SourceDir checkout --detach 5978df461662042cb4704488980632b23a2003c5
          if ((git -C $SourceDir rev-parse HEAD) -ne '5978df461662042cb4704488980632b23a2003c5') {
            throw 'zju-connect 源码提交校验失败'
          }
          New-Item -ItemType Directory -Force -Path $OutputDir | Out-Null
          Push-Location $SourceDir
          go mod download
          $ZjuBinary = Join-Path $OutputDir 'zju-connect.exe'
          go build -trimpath -ldflags '-s -w -buildid=' -o $ZjuBinary .
          Pop-Location

          $WintunZip = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $WintunZip
          $WintunHash = (Get-FileHash -Algorithm SHA256 $WintunZip).Hash.ToLowerInvariant()
          if ($WintunHash -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') {
            throw "Wintun 压缩包哈希不匹配：$WintunHash"
          }
          $WintunDir = Join-Path $env:RUNNER_TEMP 'wintun'
          Expand-Archive -Path $WintunZip -DestinationPath $WintunDir
          Copy-Item (Join-Path $WintunDir 'wintun\bin\amd64\wintun.dll') $OutputDir
          Copy-Item (Join-Path $WintunDir 'wintun\LICENSE.txt') (Join-Path $OutputDir 'LICENSE-WINTUN.txt')
          Copy-Item (Join-Path $SourceDir 'LICENSE') (Join-Path $OutputDir 'LICENSE-ZJU-CONNECT.txt')
          @(
            '候选资产，不得直接进入正式安装包。',
            'zju-connect v1.2.0 commit: 5978df461662042cb4704488980632b23a2003c5',
            'source: https://github.com/Mythologyli/zju-connect',
            '在 Windows 10/11 完成公司 aTrust 真机验收且恢复定制补丁源码后方可集成。'
          ) | Set-Content -Encoding UTF8 (Join-Path $OutputDir 'CANDIDATE-NOTICE.txt')
          & (Join-Path $OutputDir 'zju-connect.exe') -version

      - name: Upload Windows engine candidate
        uses: actions/upload-artifact@v7
        with:
          name: windows-vpn-engine-candidate
          path: windows-engine-candidate

  build:
    needs: prep-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: yuyan-vpn-windows-x86_64
            update_target: windows-x86_64
            bundle_path: src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-15
            artifact: yuyan-vpn-macos-aarch64
            update_target: darwin-aarch64
            bundle_path: src-tauri/target/release/bundle/dmg/*.dmg
            expected_arch: arm64
            sidecar_suffix: aarch64-apple-darwin
          - platform: macos-15-intel
            artifact: yuyan-vpn-macos-x86_64
            update_target: darwin-x86_64
            bundle_path: src-tauri/target/release/bundle/dmg/*.dmg
            expected_arch: x86_64
            sidecar_suffix: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Pnpm
        run: npm install -g pnpm@9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Apply Bumped Version
        run: node scripts/apply-version.js ${{ needs.prep-version.outputs.version }}

      - name: Install Frontend Dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Build isolated Intel openfortivpn
        if: matrix.update_target == 'darwin-x86_64'
        shell: bash
        run: ./scripts/build-openfortivpn-intel.sh

      - name: Normalize and Verify macOS Sidecars
        if: runner.os == 'macOS'
        shell: bash
        run: |
          SDK_VERSION=$(xcrun --sdk macosx --show-sdk-version)
          OPENFORTIVPN="src-tauri/binaries/openfortivpn-${{ matrix.sidecar_suffix }}"
          ZJU_CONNECT="src-tauri/binaries/zju-connect-${{ matrix.sidecar_suffix }}"
          if [ "${{ matrix.update_target }}" = 'darwin-aarch64' ]; then
            echo '34b86b94cba093fbbfa829109ade986c072117f55d45d6d742695e7d0d89b019  src-tauri/binaries/openfortivpn-aarch64-apple-darwin' | shasum -a 256 -c -
          else
            "$OPENFORTIVPN" --version | grep -q '1.24.1'
            grep -a -q 'stage: fortisslvpn_xml' "$OPENFORTIVPN"
          fi
          for binary in "$OPENFORTIVPN" "$ZJU_CONNECT"; do
            test -x "$binary"
            file "$binary" | grep -q '${{ matrix.expected_arch }}'
          done
          if ! xcrun vtool -show-build "$OPENFORTIVPN" | grep -q 'minos 12.0'; then
            xcrun vtool \
              -set-build-version macos 12.0 "$SDK_VERSION" \
              -replace \
              -output "${OPENFORTIVPN}.patched" \
              "$OPENFORTIVPN"
            mv "${OPENFORTIVPN}.patched" "$OPENFORTIVPN"
            chmod 755 "$OPENFORTIVPN"
            codesign --force --sign - "$OPENFORTIVPN"
          fi
          xcrun vtool -show-build "$OPENFORTIVPN" | grep -q 'minos 12.0'
          xcrun vtool -show-build "$ZJU_CONNECT" | grep -q 'minos 12.0'
          strings "$ZJU_CONNECT" > "$RUNNER_TEMP/zju-connect-strings.txt"
          grep -q 'Quick SOCKS5 negotiation completed' "$RUNNER_TEMP/zju-connect-strings.txt"
          "$OPENFORTIVPN" --version
          "$ZJU_CONNECT" -version

      - name: Build Tauri App
        run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify macOS Bundle Architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_BINARY=$(find src-tauri/target/release/bundle/macos -path '*/Contents/MacOS/yuyan-swift-vpn' -type f -print -quit)
          test -n "$APP_BINARY"
          file "$APP_BINARY" | tee /tmp/yuyan-app-arch.txt
          grep -q '${{ matrix.expected_arch }}' /tmp/yuyan-app-arch.txt
          APP_MACOS_DIR=$(dirname "$APP_BINARY")
          for name in openfortivpn zju-connect; do
            SIDECAR="$APP_MACOS_DIR/$name"
            test -x "$SIDECAR"
            file "$SIDECAR" | grep -q '${{ matrix.expected_arch }}'
            xcrun vtool -show-build "$SIDECAR" | grep -q 'minos 12.0'
            if [ "$name" = 'zju-connect' ]; then
              strings "$SIDECAR" > "$RUNNER_TEMP/bundled-zju-connect-strings.txt"
              grep -q 'Quick SOCKS5 negotiation completed' "$RUNNER_TEMP/bundled-zju-connect-strings.txt"
            fi
          done

      - name: Prepare Update Artifact
        shell: bash
        run: |
          TARGET_DIR="update-artifact/${{ matrix.update_target }}"
          VERSION="${{ needs.prep-version.outputs.version }}"
          mkdir -p "$TARGET_DIR"
          cp ${{ matrix.bundle_path }} "$TARGET_DIR/"
          if [ "${{ runner.os }}" = 'Windows' ]; then
            UPDATER_FILE=$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*.exe' -type f -print -quit)
            test -n "$UPDATER_FILE"
            test -f "${UPDATER_FILE}.sig"
            UPDATE_NAME="yuyan-vpn_${VERSION}_windows-x86_64-setup.exe"
          else
            UPDATER_FILE=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -type f -print -quit)
            test -n "$UPDATER_FILE"
            test -f "${UPDATER_FILE}.sig"
            UPDATE_NAME="yuyan-vpn_${VERSION}_${{ matrix.update_target }}.app.tar.gz"
          fi
          cp "$UPDATER_FILE" "$TARGET_DIR/$UPDATE_NAME"
          cp "${UPDATER_FILE}.sig" "$TARGET_DIR/${UPDATE_NAME}.sig"

      - name: Upload Update Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: update-artifact

  release:
    needs: [prep-version, build, windows-engine-feasibility]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download macOS ARM Artifact
        uses: actions/download-artifact@v8
        with:
          name: yuyan-vpn-macos-aarch64
          path: ./dist-release/darwin-aarch64

      - name: Download macOS Intel Artifact
        uses: actions/download-artifact@v8
        with:
          name: yuyan-vpn-macos-x86_64
          path: ./dist-release/darwin-x86_64

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate signed updater manifest
        run: >-
          node scripts/generate-update-manifest.js
          "${{ needs.prep-version.outputs.version }}"
          "${{ needs.prep-version.outputs.tag }}"
          "${{ env.RELEASE_REPOSITORY }}"
          ./dist-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prep-version.outputs.tag }}
          name: yuyan-vpn ${{ needs.prep-version.outputs.tag }}
          repository: ${{ env.RELEASE_REPOSITORY }}
          target_commitish: main
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          draft: false
          prerelease: ${{ needs.prep-version.outputs.prerelease == 'true' }}
          files: |
            ./dist-release/latest.json
            ./dist-release/**/*

      - name: Commit and Push version bump
        if: github.ref_type == 'branch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/apply-version.js ${{ needs.prep-version.outputs.version }}
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore(release): bump version to ${{ needs.prep-version.outputs.version }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
