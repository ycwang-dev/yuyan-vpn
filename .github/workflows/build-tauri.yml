name: Build Tauri App

on:
  push:
    branches:
      - 'codex/**'
      - codex/windows-vpn-productization
      - feat/github-actions-build
      - main
      - yuyan-vpn
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  prep-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Missing repository secret: TAURI_SIGNING_PRIVATE_KEY' >&2
            exit 1
          fi

      - name: Validate private VPN build configuration
        shell: bash
        env:
          VITE_DEFAULT_FORTINET_HOST: ${{ secrets.VITE_DEFAULT_FORTINET_HOST }}
          VITE_DEFAULT_FORTINET_PORT: ${{ secrets.VITE_DEFAULT_FORTINET_PORT }}
          VITE_DEFAULT_FORTINET_USERNAME: ${{ secrets.VITE_DEFAULT_FORTINET_USERNAME }}
          VITE_DEFAULT_FORTINET_ROUTES: ${{ secrets.VITE_DEFAULT_FORTINET_ROUTES }}
          VITE_DEFAULT_ATRUST_HOST: ${{ secrets.VITE_DEFAULT_ATRUST_HOST }}
          VITE_DEFAULT_ATRUST_PORT: ${{ secrets.VITE_DEFAULT_ATRUST_PORT }}
          VITE_DEFAULT_ATRUST_USERNAME: ${{ secrets.VITE_DEFAULT_ATRUST_USERNAME }}
        run: |
          required=(
            VITE_DEFAULT_FORTINET_HOST
            VITE_DEFAULT_FORTINET_PORT
            VITE_DEFAULT_FORTINET_USERNAME
            VITE_DEFAULT_FORTINET_ROUTES
            VITE_DEFAULT_ATRUST_HOST
            VITE_DEFAULT_ATRUST_PORT
            VITE_DEFAULT_ATRUST_USERNAME
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret: $name" >&2
              exit 1
            fi
          done
          case "$VITE_DEFAULT_FORTINET_HOST $VITE_DEFAULT_ATRUST_HOST" in
            *example.com*)
              echo 'VPN build configuration still contains public placeholder hosts' >&2
              exit 1
              ;;
          esac
          [[ "$VITE_DEFAULT_FORTINET_PORT" =~ ^[0-9]+$ ]] || exit 1
          [[ "$VITE_DEFAULT_ATRUST_PORT" =~ ^[0-9]+$ ]] || exit 1
          (( VITE_DEFAULT_FORTINET_PORT >= 1 && VITE_DEFAULT_FORTINET_PORT <= 65535 )) || exit 1
          (( VITE_DEFAULT_ATRUST_PORT >= 1 && VITE_DEFAULT_ATRUST_PORT <= 65535 )) || exit 1

      - name: Calculate Version
        id: calc
        run: node scripts/bump-version.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test updater manifest generator
        run: node --test scripts/generate-update-manifest.test.js

  windows-engine-feasibility:
    needs: prep-version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'
          cache: false

      - name: Setup MSYS2 for pinned openfortivpn candidate
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            patch
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-ninja

      - name: Build pinned zju-connect candidate with Wintun
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $SourceDir = Join-Path $env:RUNNER_TEMP 'zju-connect-source'
          $OutputDir = Join-Path $env:GITHUB_WORKSPACE 'windows-engine-candidate'
          $PatchPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\patches\zju-connect-windows-quicksocks.patch'
          git clone --filter=blob:none --no-checkout https://github.com/Cuistiano/zju-connect.git $SourceDir
          git -C $SourceDir checkout --detach fcbb843250cafb12a99f0cb8cc3978aff4b5aaca
          if ((git -C $SourceDir rev-parse HEAD) -ne 'fcbb843250cafb12a99f0cb8cc3978aff4b5aaca') {
            throw 'zju-connect 源码提交校验失败'
          }
          git -C $SourceDir apply --check $PatchPath
          git -C $SourceDir apply $PatchPath
          New-Item -ItemType Directory -Force -Path $OutputDir | Out-Null
          Push-Location $SourceDir
          go mod download
          go test ./client/atrust
          $ZjuBinary = Join-Path $OutputDir 'zju-connect.exe'
          go build -trimpath -ldflags '-s -w -buildid=' -o $ZjuBinary .
          Pop-Location

          $ZjuStrings = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($ZjuBinary))
          if (-not $ZjuStrings.Contains('Quick SOCKS5 negotiation completed')) {
            throw 'Windows aTrust 引擎缺少 Quick SOCKS5 兼容补丁'
          }
          if (-not $ZjuStrings.Contains('YUYAN_VPN_EMBEDDED_CAPTCHA')) {
            throw 'Windows aTrust 引擎缺少内嵌验证码门禁'
          }

          $WintunZip = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $WintunZip
          $WintunHash = (Get-FileHash -Algorithm SHA256 $WintunZip).Hash.ToLowerInvariant()
          if ($WintunHash -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') {
            throw "Wintun 压缩包哈希不匹配：$WintunHash"
          }
          $WintunDir = Join-Path $env:RUNNER_TEMP 'wintun'
          Expand-Archive -Path $WintunZip -DestinationPath $WintunDir
          Copy-Item (Join-Path $WintunDir 'wintun\bin\amd64\wintun.dll') $OutputDir
          Copy-Item (Join-Path $WintunDir 'wintun\LICENSE.txt') (Join-Path $OutputDir 'LICENSE-WINTUN.txt')
          Copy-Item (Join-Path $SourceDir 'LICENSE') (Join-Path $OutputDir 'LICENSE-ZJU-CONNECT.txt')
          & (Join-Path $OutputDir 'zju-connect.exe') -version

      - name: Build patched pinned openfortivpn Windows candidate
        shell: msys2 {0}
        run: |
          set -euo pipefail
          SOURCE_DIR="$(cygpath -u "$RUNNER_TEMP")/openfortivpn-windows-source"
          OUTPUT_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/windows-engine-candidate"
          CLEANUP_PATCH_PATH="$(cygpath -u "$GITHUB_WORKSPACE")/scripts/patches/openfortivpn-windows-cleanup.patch"
          LEGACY_CONFIG_PATCH_PATH="$(cygpath -u "$GITHUB_WORKSPACE")/scripts/patches/openfortivpn-windows-legacy-config.patch"
          HTTP_STATUS_PATCH_PATH="$(cygpath -u "$GITHUB_WORKSPACE")/scripts/patches/openfortivpn-windows-http-status.patch"
          WINDOWS_STABILITY_PATCH_PATH="$(cygpath -u "$GITHUB_WORKSPACE")/scripts/patches/openfortivpn-windows-stability.patch"
          COMMIT='409de945242328d7bea6e225dcfb2f45b7fe70e5'

          git -c core.autocrlf=false clone --filter=blob:none --no-checkout \
            https://github.com/hkirste/openfortivpn.git "$SOURCE_DIR"
          git -C "$SOURCE_DIR" -c core.autocrlf=false checkout --detach "$COMMIT"
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$COMMIT"
          git -C "$SOURCE_DIR" apply --check "$CLEANUP_PATCH_PATH"
          git -C "$SOURCE_DIR" apply "$CLEANUP_PATCH_PATH"
          git -C "$SOURCE_DIR" apply --check "$LEGACY_CONFIG_PATCH_PATH"
          git -C "$SOURCE_DIR" apply "$LEGACY_CONFIG_PATCH_PATH"
          git -C "$SOURCE_DIR" apply --check "$HTTP_STATUS_PATCH_PATH"
          git -C "$SOURCE_DIR" apply "$HTTP_STATUS_PATCH_PATH"
          git -C "$SOURCE_DIR" apply --check "$WINDOWS_STABILITY_PATCH_PATH"
          git -C "$SOURCE_DIR" apply "$WINDOWS_STABILITY_PATCH_PATH"

          cmake -S "$SOURCE_DIR" -B "$SOURCE_DIR/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON
          cmake --build "$SOURCE_DIR/build"
          ctest --test-dir "$SOURCE_DIR/build" --output-on-failure

          cp "$SOURCE_DIR/build/openfortivpn.exe" "$OUTPUT_DIR/openfortivpn.exe"
          cp "$SOURCE_DIR/LICENSE" "$OUTPUT_DIR/LICENSE-OPENFORTIVPN.txt"
          cp "$SOURCE_DIR/LICENSE.OpenSSL" "$OUTPUT_DIR/LICENSE-OPENSSL.txt"

          OPENFORTIVPN_VERSION="$("$OUTPUT_DIR/openfortivpn.exe" --version)"
          test "$OPENFORTIVPN_VERSION" = '1.24.1'
          JSON_EVENTS_VERSION="$("$OUTPUT_DIR/openfortivpn.exe" --json-events --version)"
          test "$JSON_EVENTS_VERSION" = '1.24.1'
          STRINGS_PATH="$(cygpath -u "$RUNNER_TEMP")/openfortivpn-windows-strings.txt"
          strings "$OUTPUT_DIR/openfortivpn.exe" > "$STRINGS_PATH"
          grep -q 'Wintun adapter destroyed' "$STRINGS_PATH"
          grep -q 'stage: fortisslvpn_xml' "$STRINGS_PATH"
          grep -q 'Legacy FortiOS VPN configuration accepted' "$STRINGS_PATH"
          grep -q 'Tunnel ended; reconnecting' "$STRINGS_PATH"
          grep -q 'Sent LCP Echo-Request keepalive' "$STRINGS_PATH"
          grep -q 'I/O stopped unexpectedly' "$STRINGS_PATH"
          ldd "$OUTPUT_DIR/openfortivpn.exe" | tee "$OUTPUT_DIR/openfortivpn-runtime-dependencies.txt"
          if grep -q 'not found' "$OUTPUT_DIR/openfortivpn-runtime-dependencies.txt"; then
            echo 'openfortivpn Windows 候选仍有缺失的运行库' >&2
            exit 1
          fi
          awk '/=> \/mingw64\/bin\// { print $3 }' "$OUTPUT_DIR/openfortivpn-runtime-dependencies.txt" \
            | while IFS= read -r runtime_dll; do
                cp "$runtime_dll" "$OUTPUT_DIR/"
              done

      - name: Record Windows engine candidate boundary
        shell: pwsh
        run: |
          $OutputDir = Join-Path $env:GITHUB_WORKSPACE 'windows-engine-candidate'
          @(
            'Windows 内部引擎构建资产；仅允许由本工作流注入并经过安装包门禁后发布。',
            'zju-connect PR #112 commit: fcbb843250cafb12a99f0cb8cc3978aff4b5aaca',
            'zju-connect Windows Quick SOCKS5 and embedded captcha patch: scripts/patches/zju-connect-windows-quicksocks.patch',
            'openfortivpn Windows PR candidate commit: 409de945242328d7bea6e225dcfb2f45b7fe70e5',
            'openfortivpn cleanup patch: scripts/patches/openfortivpn-windows-cleanup.patch',
            'openfortivpn legacy FortiOS config patch: scripts/patches/openfortivpn-windows-legacy-config.patch',
            'openfortivpn HTTP stage patch: scripts/patches/openfortivpn-windows-http-status.patch',
            'openfortivpn Windows keepalive and diagnostics patch: scripts/patches/openfortivpn-windows-stability.patch',
            'Wintun 0.14.1 official signed amd64 DLL.',
            'Windows x86_64 旧基线已完成真机验收；本稳定性补丁候选需在合并 main 前复验。'
          ) | Set-Content -Encoding UTF8 (Join-Path $OutputDir 'CANDIDATE-NOTICE.txt')

      - name: Upload Windows engine candidate
        uses: actions/upload-artifact@v7
        with:
          name: windows-vpn-engine-candidate
          path: windows-engine-candidate

  build:
    needs: [prep-version, windows-engine-feasibility]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: yuyan-vpn-windows-x86_64
            update_target: windows-x86_64
            bundle_path: src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-15
            artifact: yuyan-vpn-macos-aarch64
            update_target: darwin-aarch64
            bundle_path: src-tauri/target/release/bundle/dmg/*.dmg
            expected_arch: arm64
            sidecar_suffix: aarch64-apple-darwin
          - platform: macos-15-intel
            artifact: yuyan-vpn-macos-x86_64
            update_target: darwin-x86_64
            bundle_path: src-tauri/target/release/bundle/dmg/*.dmg
            expected_arch: x86_64
            sidecar_suffix: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Pnpm
        run: npm install -g pnpm@9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Apply Bumped Version
        run: node scripts/apply-version.js ${{ needs.prep-version.outputs.version }}

      - name: Install Frontend Dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Download pinned Windows VPN engines
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: windows-vpn-engine-candidate
          path: windows-engine-candidate

      - name: Prepare Windows VPN sidecars and runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $CandidateDir = Join-Path $env:GITHUB_WORKSPACE 'windows-engine-candidate'
          $BinaryDir = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\binaries'
          $RuntimeDir = Join-Path $BinaryDir 'windows-runtime'
          $LicenseDir = Join-Path $RuntimeDir 'licenses'
          New-Item -ItemType Directory -Force -Path $BinaryDir, $RuntimeDir, $LicenseDir | Out-Null

          $FortinetTarget = Join-Path $BinaryDir 'openfortivpn-x86_64-pc-windows-msvc.exe'
          $AtrustTarget = Join-Path $BinaryDir 'zju-connect-x86_64-pc-windows-msvc.exe'
          Copy-Item (Join-Path $CandidateDir 'openfortivpn.exe') $FortinetTarget
          Copy-Item (Join-Path $CandidateDir 'zju-connect.exe') $AtrustTarget
          Get-ChildItem $CandidateDir -Filter '*.dll' -File | Copy-Item -Destination $RuntimeDir
          Copy-Item (Join-Path $CandidateDir 'wintun.dll') (Join-Path $BinaryDir 'wintun.dll')
          Get-ChildItem $CandidateDir -Filter 'LICENSE-*' -File | Copy-Item -Destination $LicenseDir
          Copy-Item (Join-Path $CandidateDir 'openfortivpn-runtime-dependencies.txt') $LicenseDir
          @(
            'Windows 候选版：稳定性补丁需在 Windows x86_64 物理机复验后再合并 main。',
            '引擎来源、固定提交与哈希见仓库 scripts/vpn-engines.lock.json。'
          ) | Set-Content -Encoding UTF8 (Join-Path $RuntimeDir 'WINDOWS-NOTICE.txt')

          if (-not (Test-Path (Join-Path $RuntimeDir 'wintun.dll'))) {
            throw 'Windows 安装包缺少官方 wintun.dll'
          }
          if (-not (Test-Path (Join-Path $BinaryDir 'wintun.dll'))) {
            throw 'Windows 安装包缺少主程序同级官方 wintun.dll'
          }
          if ((Get-ChildItem $RuntimeDir -Filter '*.dll' -File).Count -lt 2) {
            throw 'Windows 安装包未收齐 openfortivpn 运行库'
          }
          $PreviousPath = $env:PATH
          $env:PATH = "$RuntimeDir;$env:PATH"
          Push-Location $RuntimeDir
          try {
            if ((& $FortinetTarget --json-events --version) -ne '1.24.1') {
              throw 'Windows 安装包 openfortivpn 版本或事件参数校验失败'
            }
            & $AtrustTarget -version
            if ($LASTEXITCODE -ne 0) {
              throw 'Windows 安装包 zju-connect 版本校验失败'
            }
          } finally {
            Pop-Location
            $env:PATH = $PreviousPath
          }

      - name: Test Windows Rust backend
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build isolated macOS openfortivpn
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/build-openfortivpn-intel.sh "src-tauri/binaries/openfortivpn-${{ matrix.sidecar_suffix }}"

      - name: Normalize and Verify macOS Sidecars
        if: runner.os == 'macOS'
        shell: bash
        run: |
          SDK_VERSION=$(xcrun --sdk macosx --show-sdk-version)
          OPENFORTIVPN="src-tauri/binaries/openfortivpn-${{ matrix.sidecar_suffix }}"
          ZJU_CONNECT="src-tauri/binaries/zju-connect-${{ matrix.sidecar_suffix }}"
          "$OPENFORTIVPN" --version | grep -q '1.24.1'
          grep -a -q 'stage: fortisslvpn_xml' "$OPENFORTIVPN"
          grep -a -q 'Legacy FortiOS VPN configuration accepted' "$OPENFORTIVPN"
          grep -a -q 'Tunnel ended; reconnecting' "$OPENFORTIVPN"
          for binary in "$OPENFORTIVPN" "$ZJU_CONNECT"; do
            test -x "$binary"
            file "$binary" | grep -q '${{ matrix.expected_arch }}'
          done
          if ! xcrun vtool -show-build "$OPENFORTIVPN" | grep -q 'minos 12.0'; then
            xcrun vtool \
              -set-build-version macos 12.0 "$SDK_VERSION" \
              -replace \
              -output "${OPENFORTIVPN}.patched" \
              "$OPENFORTIVPN"
            mv "${OPENFORTIVPN}.patched" "$OPENFORTIVPN"
            chmod 755 "$OPENFORTIVPN"
            codesign --force --sign - "$OPENFORTIVPN"
          fi
          xcrun vtool -show-build "$OPENFORTIVPN" | grep -q 'minos 12.0'
          xcrun vtool -show-build "$ZJU_CONNECT" | grep -q 'minos 12.0'
          strings "$ZJU_CONNECT" > "$RUNNER_TEMP/zju-connect-strings.txt"
          grep -q 'Quick SOCKS5 negotiation completed' "$RUNNER_TEMP/zju-connect-strings.txt"
          "$OPENFORTIVPN" --version
          "$ZJU_CONNECT" -version

      - name: Build Tauri App
        run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_DEFAULT_FORTINET_HOST: ${{ secrets.VITE_DEFAULT_FORTINET_HOST }}
          VITE_DEFAULT_FORTINET_PORT: ${{ secrets.VITE_DEFAULT_FORTINET_PORT }}
          VITE_DEFAULT_FORTINET_USERNAME: ${{ secrets.VITE_DEFAULT_FORTINET_USERNAME }}
          VITE_DEFAULT_FORTINET_ROUTES: ${{ secrets.VITE_DEFAULT_FORTINET_ROUTES }}
          VITE_DEFAULT_ATRUST_HOST: ${{ secrets.VITE_DEFAULT_ATRUST_HOST }}
          VITE_DEFAULT_ATRUST_PORT: ${{ secrets.VITE_DEFAULT_ATRUST_PORT }}
          VITE_DEFAULT_ATRUST_USERNAME: ${{ secrets.VITE_DEFAULT_ATRUST_USERNAME }}

      - name: Verify macOS Bundle Architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_BINARY=$(find src-tauri/target/release/bundle/macos -path '*/Contents/MacOS/yuyan-swift-vpn' -type f -print -quit)
          test -n "$APP_BINARY"
          file "$APP_BINARY" | tee /tmp/yuyan-app-arch.txt
          grep -q '${{ matrix.expected_arch }}' /tmp/yuyan-app-arch.txt
          APP_MACOS_DIR=$(dirname "$APP_BINARY")
          for name in openfortivpn zju-connect; do
            SIDECAR="$APP_MACOS_DIR/$name"
            test -x "$SIDECAR"
            file "$SIDECAR" | grep -q '${{ matrix.expected_arch }}'
            xcrun vtool -show-build "$SIDECAR" | grep -q 'minos 12.0'
            if [ "$name" = 'zju-connect' ]; then
              strings "$SIDECAR" > "$RUNNER_TEMP/bundled-zju-connect-strings.txt"
              grep -q 'Quick SOCKS5 negotiation completed' "$RUNNER_TEMP/bundled-zju-connect-strings.txt"
            fi
          done

      - name: Install and verify Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Installer = (Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe' -File | Select-Object -First 1).FullName
          if (-not $Installer) {
            throw '未生成 Windows NSIS 安装包'
          }
          $InstallDir = Join-Path $env:RUNNER_TEMP 'yuyan-vpn-stable-installed'
          $InstallProcess = Start-Process -FilePath $Installer -ArgumentList '/S', "/D=$InstallDir" -Wait -PassThru
          if ($InstallProcess.ExitCode -ne 0) {
            throw "Windows NSIS 静默安装失败：$($InstallProcess.ExitCode)"
          }

          $FortinetBinary = Join-Path $InstallDir 'openfortivpn.exe'
          $AtrustBinary = Join-Path $InstallDir 'zju-connect.exe'
          $RuntimeDir = Join-Path $InstallDir 'binaries\windows-runtime'
          $RootWintun = Join-Path $InstallDir 'wintun.dll'
          $RuntimeWintun = Join-Path $RuntimeDir 'wintun.dll'
          foreach ($RequiredPath in @(
            $FortinetBinary,
            $AtrustBinary,
            $RootWintun,
            $RuntimeWintun,
            (Join-Path $RuntimeDir 'WINDOWS-NOTICE.txt')
          )) {
            if (-not (Test-Path $RequiredPath)) {
              throw "Windows 安装包缺少运行资产：$RequiredPath"
            }
          }
          if ((Get-ChildItem $RuntimeDir -Filter '*.dll' -File).Count -lt 2) {
            throw 'Windows 安装包未携带完整 VPN 动态运行库'
          }
          if ((Get-FileHash -Algorithm SHA256 $RootWintun).Hash -ne (Get-FileHash -Algorithm SHA256 $RuntimeWintun).Hash) {
            throw 'Windows 安装包中的两份 Wintun DLL 内容不一致'
          }

          $WintunHandle = [System.Runtime.InteropServices.NativeLibrary]::Load($RootWintun)
          try {
            $WintunCreateAdapter = [IntPtr]::Zero
            if (-not [System.Runtime.InteropServices.NativeLibrary]::TryGetExport(
              $WintunHandle,
              'WintunCreateAdapter',
              [ref]$WintunCreateAdapter
            )) {
              throw '主程序同级 wintun.dll 缺少 WintunCreateAdapter 导出'
            }
          } finally {
            [System.Runtime.InteropServices.NativeLibrary]::Free($WintunHandle)
          }

          $PreviousPath = $env:PATH
          $env:PATH = "$RuntimeDir;$env:PATH"
          Push-Location $RuntimeDir
          try {
            if ((& $FortinetBinary --json-events --version) -ne '1.24.1') {
              throw '安装后的 openfortivpn 无法加载或版本不符'
            }
            & $AtrustBinary -version
            if ($LASTEXITCODE -ne 0) {
              throw '安装后的 zju-connect 无法加载'
            }
          } finally {
            Pop-Location
            $env:PATH = $PreviousPath
          }

          $Uninstaller = Join-Path $InstallDir 'uninstall.exe'
          if (Test-Path $Uninstaller) {
            $UninstallProcess = Start-Process -FilePath $Uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($UninstallProcess.ExitCode -ne 0) {
              throw "Windows NSIS 静默卸载失败：$($UninstallProcess.ExitCode)"
            }
          }

      - name: Prepare Update Artifact
        shell: bash
        run: |
          TARGET_DIR="update-artifact/${{ matrix.update_target }}"
          VERSION="${{ needs.prep-version.outputs.version }}"
          mkdir -p "$TARGET_DIR"
          cp ${{ matrix.bundle_path }} "$TARGET_DIR/"
          if [ "${{ runner.os }}" = 'Windows' ]; then
            UPDATER_FILE=$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*.exe' -type f -print -quit)
            test -n "$UPDATER_FILE"
            test -f "${UPDATER_FILE}.sig"
            UPDATE_NAME="yuyan-vpn_${VERSION}_windows-x86_64-setup.exe"
          else
            UPDATER_FILE=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -type f -print -quit)
            test -n "$UPDATER_FILE"
            test -f "${UPDATER_FILE}.sig"
            UPDATE_NAME="yuyan-vpn_${VERSION}_${{ matrix.update_target }}.app.tar.gz"
          fi
          cp "$UPDATER_FILE" "$TARGET_DIR/$UPDATE_NAME"
          cp "${UPDATER_FILE}.sig" "$TARGET_DIR/${UPDATE_NAME}.sig"

      - name: Upload Update Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: update-artifact

  release:
    needs: [prep-version, build, windows-engine-feasibility]
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download macOS ARM Artifact
        uses: actions/download-artifact@v8
        with:
          name: yuyan-vpn-macos-aarch64
          path: ./dist-release/darwin-aarch64

      - name: Download macOS Intel Artifact
        uses: actions/download-artifact@v8
        with:
          name: yuyan-vpn-macos-x86_64
          path: ./dist-release/darwin-x86_64

      - name: Download Windows x86_64 Artifact
        uses: actions/download-artifact@v8
        with:
          name: yuyan-vpn-windows-x86_64
          path: ./dist-release/windows-x86_64

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate signed updater manifest
        run: >-
          node scripts/generate-update-manifest.js
          "${{ needs.prep-version.outputs.version }}"
          "${{ needs.prep-version.outputs.tag }}"
          "${{ github.repository }}"
          ./dist-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prep-version.outputs.tag }}
          name: yuyan-vpn ${{ needs.prep-version.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: ${{ needs.prep-version.outputs.prerelease == 'true' }}
          files: |
            ./dist-release/latest.json
            ./dist-release/**/*

      - name: Commit and Push version bump
        if: github.ref_type == 'branch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/apply-version.js ${{ needs.prep-version.outputs.version }}
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore(release): bump version to ${{ needs.prep-version.outputs.version }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
